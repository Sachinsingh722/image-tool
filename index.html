<!DOCTYPE html>
<html>
<head>
  <title>Image Layout Tool</title>
  <style>
    body { text-align:center; font-family: Arial; }
    canvas { border:1px solid black; margin-top:20px; }
  </style>
</head>
<body>

<h2>Image Layout Generator</h2>

<input type="file" id="ref" accept="image/*"><br><br>
<input type="file" id="prod" accept="image/*"><br><br>

<button onclick="generate()">Generate Image</button>
  <button onclick="downloadImage()">Download Image</button>

<br><br>
X: <input type="range" id="posX" min="0" max="500" value="100"><br>
Y: <input type="range" id="posY" min="0" max="500" value="100"><br>
Size: <input type="range" id="size" min="100" max="600" value="300"><br>

<br><canvas id="canvas" width="500" height="500"></canvas>

<script>
function generate() {
  const ref = document.getElementById('ref').files[0];
  const prod = document.getElementById('prod').files[0];

  if (!ref || !prod) {
    alert("Upload both images");
    return;
  }

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const refImg = new Image();
  const prodImg = new Image();

  refImg.src = URL.createObjectURL(ref);
  prodImg.src = URL.createObjectURL(prod);

  refImg.onload = () => {
    // Reference image halka background jaisa
    ctx.globalAlpha = 0.3;
    ctx.drawImage(refImg, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;

    prodImg.onload = () => {

      // Slider values
      const posX = document.getElementById("posX").value;
      const posY = document.getElementById("posY").value;
      const size = document.getElementById("size").value;

      // Product image draw
      ctx.drawImage(prodImg, posX, posY, size, size);

    }
  }
}

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const refImg = new Image();
  const prodImg = new Image();

  refImg.src = URL.createObjectURL(ref);
  prodImg.src = URL.createObjectURL(prod);

  refImg.onload = () => {
    ctx.globalAlpha = 0.3;
ctx.drawImage(refImg, 0, 0, 500, 500);
ctx.globalAlpha = 1;

    prodImg.onload = () => {
      // Adjust position & size here
  // Center position calculate
const img = prodImg;

const imgRatio = img.width / img.height;
const canvasRatio = canvas.width / canvas.height;

let drawWidth, drawHeight;

if (imgRatio > canvasRatio) {
  drawWidth = canvas.width;
  drawHeight = canvas.width / imgRatio;
} else {
  drawHeight = canvas.height;
  drawWidth = canvas.height * imgRatio;
}

const x = (canvas.width - drawWidth) / 2;
const y = (canvas.height - drawHeight) / 2;

const posX = document.getElementById("posX").value;
const posY = document.getElementById("posY").value;
const size = document.getElementById("size").value;

ctx.drawImage(img, posX, posY, size, size);
// Transparency (blend effect)
ctx.globalAlpha = 0.9;

// Rounded image function
function drawRoundedImage(ctx, img, x, y, width, height, radius) {
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
  ctx.clip();

ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  ctx.restore();
}

// Call function
drawRoundedImage(ctx, prodImg, x, y, 300, 250, 20);
    }
  }
}
</script>

</body>
</html>
